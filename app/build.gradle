plugins { id 'com.android.application' }

def tvClientId = System.getenv("GOOGLE_TV_CLIENT_ID") ?: ""
def tvClientSecret = System.getenv("GOOGLE_TV_CLIENT_SECRET") ?: ""
def escapeBuildConfig = { value -> value.replace("\\", "\\\\").replace('"', '\\"') }

android {
    namespace 'cl.fernando.nubemusica'
    compileSdk 36

    defaultConfig {
        applicationId 'cl.fernando.nubemusica'
        minSdk 26
        targetSdk 36
        versionCode 11
        versionName '0.5.0-tv5-full-drive'
        buildConfigField "String", "GOOGLE_TV_CLIENT_ID", "\"" + escapeBuildConfig(tvClientId) + "\""
        buildConfigField "String", "GOOGLE_TV_CLIENT_SECRET", "\"" + escapeBuildConfig(tvClientSecret) + "\""
        buildConfigField "String", "FULL_DRIVE_BRIDGE_URL", "\"https://script.google.com/macros/s/AKfycbyCY581IzHbCtKoFaLlWi1UIoJKoTDd_o59RMQ9ZtONML3MEdaLJmqqkTA9GJsf7JYmjQ/exec\""
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        debug {
            storeFile rootProject.file('dev-signing/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    implementation 'androidx.media3:media3-exoplayer:1.9.4'
    implementation 'androidx.media3:media3-session:1.9.4'
    implementation 'androidx.media3:media3-ui:1.9.4'
    implementation 'androidx.media3:media3-datasource:1.9.4'
    testImplementation 'junit:junit:4.13.2'
}
